name: Savi Technology
description: >-
  Savi Technology provides Internet of Things (IoT) and active RFID (aRFID)
  solutions for real-time supply chain visibility, asset tracking, and cargo
  security. Combining active RFID tags, environmental condition sensors, and
  machine intelligence, Savi delivers location, condition, and estimated-time-
  of-arrival data for cargo and high-value assets across government, military
  (including U.S. Department of Defense in-transit visibility), and commercial
  supply chains. The company is headquartered in Wilmington, North Carolina.
  As of this enrichment pass, Savi Technology exposes no public developer
  portal, OpenAPI/Swagger definition, SDKs, or documented web API; its only
  authenticated surface is the aRFID-VI customer catalog (savirfidcatalog.net).
